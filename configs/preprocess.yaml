# Data preparation. Every number used by src/prepare_data.py lives here.
seed: 42
fs: 360      # The ECG machine took 360 measurements every second
lead: MLII                      # selected by name, never by index (record 114 is swapped)

paths:
  raw_mitdb: data/raw/mitdb
  raw_nstdb: data/raw/nstdb
  processed: data/processed
  results: results

records:
  validation: [118,124,201,203,205]      # subset of DS1; train = DS1 - validation. DS1 and DS2 are in src/ecg/constants.py. Keeps 208 (most F beats) and 209 (most S beats) in training

beat:
  samples_before: 90 # To capture the P value before the R peak
  samples_after: 166              # To capture the T value after the R peak; total window = 256

filter:
  enabled: true
  method: median                  # median | highpass | none
  median_kernels_ms: [200, 600]
  highpass_hz: 0.5
  lowpass_hz: 40                  # set null to disable

normalize:
  method: zscore                  # zscore | maxabs | none
  clip: 8.0                       # clip to [-clip, clip] after normalization. R-peaks reach 5-7 std, so 4 would flatten most of them
