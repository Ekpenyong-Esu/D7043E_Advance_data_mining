# ECG wave names:
#   P wave      = atrial depolarization (atria activate and contract)
#                 heart part: atria (upper chambers), triggered by the SA node (natural pacemaker)
#   QRS complex = ventricular depolarization (the main beat); R peak = its tallest point
#                 heart part: ventricles (lower chambers), signal via AV node -> bundle of His -> Purkinje fibres
#   T wave      = ventricular repolarization (ventricles reset for the next beat)
#                 heart part: ventricles (lower chambers)
#
# Data preparation. Every number used by the preprocessing step of notebooks/EDA.ipynb lives here.
seed: 42
fs: 360      # The ECG machine took 360 measurements every second
lead: MLII                      # selected by name, never by index (record 114 is swapped)

paths:
  raw_mitdb: data/raw/mitdb
  raw_nstdb: data/raw/nstdb
  processed: data/processed
  results: results

records:
  validation: [124,201,205,220,223]      # subset of DS1; train = DS1 - validation. DS1 and DS2 are in src/ecg/constants.py. Keeps 208 (most F beats) and 209 (most S beats) in training.
                                         # Submission 2 revision (was [118,124,201,203,205]): 118 and 203 moved to training, 220 and 223 to validation.
                                         # 118: training now contains right-bundle-branch-block beats, validation keeps one such record (124).
                                         # 203: the noisiest record of the database made up a quarter of the validation beats and dominated model
                                         # selection; in training it teaches the model realistic noise instead. See report section 3.1.

beat:
  samples_before: 90 # To capture the P (atrial) value before the R (ventricular) the tallest peak
  samples_after: 166              # To capture the T (ventricular) value after the R peak; total window = 256

filter:
  enabled: true
  method: median                  # median | highpass | none
  median_kernels_ms: [200, 600]
  highpass_hz: 0.5
  lowpass_hz: 40                  # remove noise above 40 Hz

normalize:
  method: zscore                  # zscore, each beats is scaled to the mean zero and standard deviation of one
  clip: 8.0                       # clip to [-clip, clip] after normalization. R-peaks reach 5-7 std, so 4 would flatten most of them